<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CartoSky is an interactive weather mapping application for viewing forecast models, radar, SPC outlooks, and location-based weather data in one map-first workflow."
    />
    <link rel="icon" type="image/png" href="/assets/favicon.ico" />
    <title>CartoSky</title>
    <link rel="preconnect" href="https://api.cartosky.com" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://d.basemaps.cartocdn.com" />
    <script>
      // Route-aware boot shell: /viewer gets a viewer-shaped static fallback
      // instead of the generic boot card. Synchronous and tiny so the first
      // paint never waits on the React bundle. Without JS the generic card
      // remains the default.
      try {
        if (window.location.pathname === "/viewer") {
          var root = document.documentElement;
          root.setAttribute("data-boot-route", "viewer");
          // Phase 6 rail geometry, resolved before the bundle so the static
          // shell paints the same chrome React will mount.
          // MIRROR OF frontend/src/lib/viewer-rail.ts — keep both sides in sync
          // (constants, formula and storage keys are duplicated deliberately).
          var RAIL_EXPANDED_PX = 288;
          var RAIL_COLLAPSED_PX = 72;
          var RAIL_MOBILE_MAX_WIDTH = 767;
          var RAIL_WIDE_MIN_MAP_WIDTH = 1024;
          var RAIL_MAP_INSETS_PX = 0;
          // MIRROR OF frontend/src/lib/viewer-mobile.ts MOBILE_BAR_PX — the
          // Phase 8 mobile viewer bar. The boot shell must publish the same
          // top-bar height React will publish, or the static header paints
          // 3.5rem and then snaps to 52px when the bundle mounts (and the
          // AppLayout backdrop row shows a 4 px strip in the meantime).
          var MOBILE_BAR_PX = 52;
          var viewportWidth = window.innerWidth;
          var railWidth = 0;
          if (viewportWidth > RAIL_MOBILE_MAX_WIDTH) {
            var breakpointClass =
              viewportWidth - RAIL_EXPANDED_PX - RAIL_MAP_INSETS_PX >= RAIL_WIDE_MIN_MAP_WIDTH
                ? "wide"
                : "narrow";
            var override = null;
            try {
              override = window.localStorage.getItem("twf.rail.mode." + breakpointClass);
            } catch (storageError) {}
            var state =
              override === "expanded" || override === "collapsed"
                ? override
                : breakpointClass === "wide"
                  ? "expanded"
                  : "collapsed";
            railWidth = state === "expanded" ? RAIL_EXPANDED_PX : RAIL_COLLAPSED_PX;
          }
          root.style.setProperty("--viewer-rail-width", railWidth + "px");
          root.style.setProperty(
            "--viewer-topbar-height",
            railWidth > 0
              ? "3rem"
              : viewportWidth <= RAIL_MOBILE_MAX_WIDTH
                ? MOBILE_BAR_PX + "px"
                : "3.5rem"
          );
          root.setAttribute("data-viewer-rail", railWidth > 0 ? "on" : "off");
        }
      } catch (routeError) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #07111f;
        color: #fff;
      }

      #root {
        min-height: 100svh;
      }

      .cartosky-boot-shell {
        display: grid;
        min-height: 100svh;
        place-items: center;
        background: rgba(4, 13, 24, 0.58);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }

      .cartosky-boot-card {
        display: flex;
        min-width: 9rem;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        border-radius: 1rem;
        border: 1px solid rgba(26, 58, 92, 0.6);
        background: rgba(4, 16, 30, 0.82);
        padding: 1rem 1.25rem;
        box-shadow: 0 22px 64px rgba(0, 0, 0, 0.36);
      }

      .cartosky-boot-spinner {
        position: relative;
        width: 2.75rem;
        height: 2.75rem;
      }

      .cartosky-boot-spinner-ring,
      .cartosky-boot-spinner-orbit {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
      }

      .cartosky-boot-spinner-ring {
        border: 1px solid rgba(165, 243, 252, 0.18);
      }

      .cartosky-boot-spinner-orbit {
        inset: 0.25rem;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: rgba(165, 243, 252, 1);
        animation: cartosky-boot-spin 0.8s linear infinite;
      }

      .cartosky-boot-spinner-core {
        position: absolute;
        inset: 0.95rem;
        border-radius: 9999px;
        background: rgba(165, 243, 252, 0.8);
        box-shadow: 0 0 22px rgba(103, 232, 249, 0.42);
      }

      .cartosky-boot-label {
        max-width: 13rem;
        text-align: center;
        font:
          500 0.75rem/1.4 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: rgba(255, 255, 255, 0.76);
      }

      /* Route-aware boot shells: the generic card hides on /viewer, the
         viewer shell hides everywhere else (and without JS). */
      html[data-boot-route="viewer"] .cartosky-boot-shell {
        display: none;
      }

      html:not([data-boot-route="viewer"]) .cartosky-viewer-boot-shell {
        display: none;
      }

      /* Static viewer shell — mirrors ViewerSiteHeaderFallback and
         ViewerMapSkeleton so the React handoff does not jump or flash. */
      .cartosky-viewer-boot-shell {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        background-image:
          radial-gradient(900px 520px at 50% 18%, rgba(34, 211, 238, 0.05), transparent 62%),
          radial-gradient(700px 480px at 18% 82%, rgba(37, 99, 235, 0.06), transparent 65%),
          linear-gradient(180deg, rgba(7, 17, 31, 1), rgba(8, 18, 34, 1));
      }

      .cartosky-viewer-boot-header {
        position: absolute;
        inset-inline: 0;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        height: var(--viewer-topbar-height, 3.5rem);
        padding: 0 1rem;
        border-bottom: 1px solid rgba(26, 58, 92, 0.6);
        background: rgba(3, 14, 26, 0.85);
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4), inset 0 -1px 0 rgba(100, 180, 255, 0.06);
      }

      .cartosky-viewer-boot-header img {
        display: block;
        height: 2.5rem;
        width: auto;
      }

      html[data-viewer-rail="on"] .cartosky-viewer-boot-header img {
        height: 2.5rem;
      }

      /* Rail placeholder — width resolved by the inline boot script above. */
      .cartosky-viewer-boot-rail {
        position: absolute;
        left: 0;
        top: var(--viewer-topbar-height, 3.5rem);
        bottom: 0;
        z-index: 9;
        width: var(--viewer-rail-width, 0px);
        border-right: 1px solid rgba(26, 58, 92, 0.6);
        background: rgba(3, 14, 26, 0.92);
      }

      html:not([data-viewer-rail="on"]) .cartosky-viewer-boot-rail {
        display: none;
      }

      .cartosky-viewer-boot-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding-top: var(--viewer-topbar-height, 3.5rem);
        padding-left: var(--viewer-rail-width, 0px);
      }

      .cartosky-viewer-boot-hex {
        width: 2.75rem;
        height: 2.75rem;
        overflow: visible;
      }

      .cartosky-viewer-boot-hex .hex-ghost {
        fill: none;
        stroke: rgba(165, 243, 252, 0.16);
        stroke-width: 14;
      }

      .cartosky-viewer-boot-hex .hex-comet {
        fill: none;
        stroke: #a5f3fc;
        stroke-width: 18;
        stroke-linecap: round;
        stroke-dasharray: 110 950;
        filter: drop-shadow(0 0 14px rgba(103, 232, 249, 0.42));
        animation: cartosky-viewer-boot-hex-chase 2s linear infinite;
      }

      @keyframes cartosky-viewer-boot-hex-chase {
        to {
          stroke-dashoffset: -1060;
        }
      }

      .cartosky-viewer-boot-timeline {
        position: absolute;
        inset-inline: 0;
        bottom: 2rem;
        display: flex;
        justify-content: center;
        padding: 0 1rem;
        padding-left: calc(1rem + var(--viewer-rail-width, 0px));
        pointer-events: none;
      }

      .cartosky-viewer-boot-timeline > div {
        width: min(92vw, 640px);
        height: 3rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(11, 21, 38, 0.72);
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28);
      }

      .cartosky-seo-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes cartosky-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="cartosky-viewer-boot-shell"
        role="status"
        aria-live="polite"
        aria-label="Loading viewer"
        data-viewer-boot-shell
      >
        <div class="cartosky-viewer-boot-header" data-viewer-boot-header>
          <img src="/assets/new_logo.png?v=cartosky-20260414" alt="CartoSky" />
        </div>
        <div class="cartosky-viewer-boot-rail" data-viewer-boot-rail aria-hidden="true"></div>
        <div class="cartosky-viewer-boot-center">
          <svg class="cartosky-viewer-boot-hex" viewBox="0 0 322 343" aria-hidden="true">
            <polygon class="hex-ghost" points="161,0 320,90 320,253 161,343 2,253 2,90"></polygon>
            <polygon class="hex-comet" points="161,0 320,90 320,253 161,343 2,253 2,90"></polygon>
          </svg>
          <div class="cartosky-boot-label">Loading viewer</div>
        </div>
        <div class="cartosky-viewer-boot-timeline" data-viewer-boot-timeline aria-hidden="true">
          <div></div>
        </div>
      </div>
      <div class="cartosky-boot-shell" role="status" aria-live="polite" aria-label="Loading">
        <div class="cartosky-boot-card">
          <div class="cartosky-boot-spinner" aria-hidden="true">
            <div class="cartosky-boot-spinner-ring"></div>
            <div class="cartosky-boot-spinner-orbit"></div>
            <div class="cartosky-boot-spinner-core"></div>
          </div>
          <div class="cartosky-boot-label">Loading</div>
        </div>
      </div>
      <div class="cartosky-seo-fallback">
        <main>
          <h1>CartoSky</h1>
          <p>
            CartoSky is an interactive weather mapping application for viewing forecast models,
            radar, SPC outlooks, and location-based weather data in one map-first workflow.
          </p>
          <p>
            <a href="https://cartosky.com/privacy-policy">Privacy Policy</a>
          </p>
        </main>
      </div>
    </div>
    <noscript>
      <main style="max-width: 42rem; margin: 2rem auto; padding: 0 1.25rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>CartoSky</h1>
        <p>
          CartoSky is an interactive weather mapping application for viewing forecast models,
          radar, SPC outlooks, and location-based weather data in one map-first workflow.
        </p>
        <p>
          <a href="https://cartosky.com/privacy-policy">Privacy Policy</a>
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
